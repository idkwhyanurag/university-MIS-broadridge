# Copy this file to application.properties and fill in your own local values.
# application.properties is gitignored so no one commits real credentials.

spring.application.name=mis-backend

# --- Database (shared MySQL schema - agree on host/db name as a team) ---
spring.datasource.url=jdbc:mysql://localhost:3306/university_mis?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=changeme
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Server ---
server.port=8080
