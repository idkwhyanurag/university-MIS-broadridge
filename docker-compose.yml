services:
  mysql:
    image: mysql:8.0
    container_name: mis-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: university_mis
    ports:
      - "3306:3306"
    volumes:
      - mis_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    container_name: mis-backend
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/university_mis?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: UniversityMisJwtSecretKeyChangeMeInProduction2026!!
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3010,http://localhost:5173
      PORT: "8080"

volumes:
  mis_mysql_data:
