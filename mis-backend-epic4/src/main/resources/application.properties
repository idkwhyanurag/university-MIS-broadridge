# Copy this file to application.properties and fill in your own local values.
# application.properties is gitignored so no one commits real credentials.

spring.application.name=mis-backend

# --- Database (shared MySQL schema - agree on host/db name as a team) ---
spring.datasource.url=jdbc:mysql://localhost:3306/university_mis?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Anurag@1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Mail (use Mailtrap.io free sandbox for local dev/testing) ---
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=your-mailtrap-username
spring.mail.password=your-mailtrap-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Server ---
server.port=8080
