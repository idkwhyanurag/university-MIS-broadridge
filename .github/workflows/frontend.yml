name: Frontend CI/CD

on:
  push:
    branches: [main, Final-Product]
    paths:
      - "mis-frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "mis-frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mis-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mis-frontend/package-lock.json
      - run: npm ci
      - name: Build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
        run: |
          export REACT_APP_API_URL="${REACT_APP_API_URL:-http://localhost:8080/api}"
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: mis-frontend-build
          path: mis-frontend/build

  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Final-Product')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mis-frontend/package-lock.json
      - name: Configure AWS credentials
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Build and sync to S3
        if: env.AWS_ROLE_ARN != '' && env.S3_BUCKET != ''
        working-directory: mis-frontend
        run: |
          npm ci
          npm run build
          aws s3 sync build/ "s3://${S3_BUCKET}" --delete
          # Skip placeholders like n/a-s3-website; only real distribution IDs.
          if [ -n "${CLOUDFRONT_DISTRIBUTION_ID}" ] \
            && [[ "${CLOUDFRONT_DISTRIBUTION_ID}" != n/a* ]]; then
            aws cloudfront create-invalidation \
              --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
              --paths "/*"
          else
            echo "Skipping CloudFront invalidation (CLOUDFRONT_DISTRIBUTION_ID unset or n/a*)"
          fi
