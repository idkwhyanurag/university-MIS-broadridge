name: Backend CI/CD

on:
  push:
    branches: [main, Final-Product]
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build
        run: mvn -B -DskipTests package
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mis-backend-jar
          path: target/*.jar

  docker-publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Final-Product')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        if: ${{ secrets.AWS_ROLE_ARN != '' }}
        uses: docker/setup-buildx-action@v3
      - name: Configure AWS credentials
        if: ${{ secrets.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Login to Amazon ECR
        if: ${{ secrets.AWS_ROLE_ARN != '' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push (linux/amd64)
        if: ${{ secrets.AWS_ROLE_ARN != '' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --platform linux/amd64 \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            --push .
      - name: Deploy to EC2 (pull + restart mis-api)
        if: ${{ secrets.AWS_ROLE_ARN != '' && secrets.EC2_HOST != '' && secrets.EC2_SSH_KEY != '' }}
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          KEY=/tmp/ec2-deploy.pem
          printf '%s\n' "$EC2_SSH_KEY" > "$KEY"
          chmod 600 "$KEY"
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          REMOTE_ENV="/home/ec2-user/mis-api.env"
          ECR_PASS=$(aws ecr get-login-password --region "$AWS_REGION")
          SSH=(ssh -i "$KEY" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)
          "${SSH[@]}" "ec2-user@${EC2_HOST}" \
            "echo '$ECR_PASS' | sudo docker login --username AWS --password-stdin '$ECR_REGISTRY'"
          "${SSH[@]}" "ec2-user@${EC2_HOST}" "sudo docker pull '$IMAGE'"
          "${SSH[@]}" "ec2-user@${EC2_HOST}" bash -s <<REMOTE
          set -euo pipefail
          if [ ! -f "${REMOTE_ENV}" ]; then
            echo "ERROR: ${REMOTE_ENV} missing on host — run infra/07-deploy-ec2.sh once locally first." >&2
            exit 1
          fi
          sudo docker rm -f mis-api 2>/dev/null || true
          sudo docker run -d --name mis-api --restart unless-stopped \
            -p 8080:8080 \
            --env-file "${REMOTE_ENV}" \
            "${IMAGE}"
          sudo docker ps --filter name=mis-api
          REMOTE
          rm -f "$KEY"
